<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">

    <title>Радар — Европейская Россия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        html, body {
            height: 100%;
            background: #0b1220;
            color: #e2e8f0;
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(11, 18, 32, 0.96);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            z-index: 40;
            border-bottom: 1px solid #1e293b;
        }
        .title { font-size: 15px; font-weight: 600; }
        .title span { color: #38bdf8; }

        .btns { display: flex; gap: 6px; }
        button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            width: 36px;
            height: 32px;
            border-radius: 8px;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        button:active { background: #334155; }

        .viewport {
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            bottom: 56px;
            overflow: hidden;
            background: #0b1220;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #radar {
            max-width: none;
            max-height: none;
            width: auto;
            height: auto;
            transform-origin: center center;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
            will-change: transform;
            pointer-events: none;
        }

        .footer {
            position: fixed;
            bottom: 0; left: 0; right: 0;
            height: 56px;
            background: rgba(11, 18, 32, 0.96);
            border-top: 1px solid #1e293b;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            z-index: 40;
            padding: 0 10px;
        }
        .footer button {
            width: auto;
            padding: 0 12px;
            font-size: 13px;
            height: 34px;
        }
        .hint {
            position: absolute;
            bottom: 64px;
            left: 0; right: 0;
            text-align: center;
            font-size: 11px;
            color: #64748b;
            pointer-events: none;
            z-index: 30;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Радар <span>Европ. Россия</span></div>
        <div class="btns">
            <button onclick="zoomIn()" title="Приблизить">+</button>
            <button onclick="zoomOut()" title="Отдалить">−</button>
            <button onclick="rotate(-90)" title="Повернуть влево">↺</button>
            <button onclick="rotate(90)" title="Повернуть вправо">↻</button>
            <button onclick="resetView()" title="Сбросить">⟲</button>
            <button onclick="refresh()" title="Обновить">↻</button>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <img id="radar" src="https://meteoinfo.ru/hmc-output/rmap/phenomena.gif" alt="Радар">
    </div>

    <div class="hint">Щипок / перетаскивание · кнопки +, −, вращение</div>

    <div class="footer">
        <button onclick="zoomIn()">Приблизить</button>
        <button onclick="zoomOut()">Отдалить</button>
        <button onclick="resetView()">Сброс</button>
        <button onclick="refresh()">Обновить</button>
    </div>
