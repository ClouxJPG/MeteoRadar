<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<title>Радар / модель</title>

<link rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: #05070b;
    color: #e2e8f0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    user-select: none;
    -webkit-user-select: none;
}

/* =========================================
   ШАПКА
   ========================================= */

.header {
    position: fixed;

    top: 0;
    left: 0;
    right: 0;

    height: 48px;

    background: rgba(7, 11, 18, 0.96);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 12px;

    z-index: 1000;

    border-bottom: 1px solid #1e293b;
}

.title {
    font-size: 15px;
    font-weight: 600;
}

.title span {
    color: #38bdf8;
}

.header-btns {
    display: flex;
    gap: 8px;
}

button {
    background: #1e293b;

    border: 1px solid #334155;

    color: #e2e8f0;

    padding: 7px 12px;

    border-radius: 8px;

    font-size: 13px;

    -webkit-tap-highlight-color: transparent;
}

button:active {
    background: #334155;
}

button.active {
    background: #0ea5e9;
    border-color: #0ea5e9;
    color: white;
}

/* =========================================
   ОСНОВНАЯ ОБЛАСТЬ
   ========================================= */

.viewport {

    position: fixed;

    top: 48px;
    left: 0;
    right: 0;
    bottom: 0;

    overflow: hidden;

    background: #05070b;

    touch-action: none;
}

/* =========================================
   СТАРАЯ GIF
   ========================================= */

#radar {

    position: absolute;

    top: 0;
    left: 0;

    transform-origin: 0 0;

    max-width: none;
    max-height: none;

    image-rendering: auto;

    pointer-events: none;

    z-index: 5;
}

/* =========================================
   LIBREWXR КАРТА
   ========================================= */

#libreMap {

    position: absolute;

    inset: 0;

    z-index: 10;

    background: #05070b;

    display: none;

    touch-action: pan-x pan-y pinch-zoom;
}

#libreMap.open {
    display: block;
}

/* Затемняем базовую карту */

#libreMap .leaflet-tile {

    filter:
        brightness(0.42)
        contrast(1.25)
        saturate(0.55);
}

/* Убираем стандартный zoom */

.leaflet-control-zoom {
    display: none !important;
}

/* =========================================
   КНОПКА СЛОЁВ
   ========================================= */

.radar-layers-button {

    position: absolute;

    right: 12px;
    top: 12px;

    width: 44px;
    height: 44px;

    padding: 0;

    background: rgba(15, 23, 42, 0.96);

    border: 1px solid #334155;

    border-radius: 12px;

    color: #e2e8f0;

    font-size: 21px;

    z-index: 2000;

    display: flex;
    align-items: center;
    justify-content: center;

    pointer-events: auto;

    touch-action: manipulation;

    box-shadow:
        0 5px 20px rgba(0,0,0,.35);
}

/* =========================================
   ПАНЕЛЬ
   ========================================= */

.radar-layers-panel {

    position: absolute;

    top: 0;
    right: 0;

    width: 300px;
    max-width: 86vw;

    height: 100%;

    background: rgba(10, 15, 25, 0.98);

    border-left: 1px solid #334155;

    z-index: 3000;

    transform: translateX(100%);

    transition:
        transform .28s ease;

    box-shadow:
        -10px 0 35px rgba(0,0,0,.45);

    overflow-y: auto;

    pointer-events: none;

    touch-action: auto;
}

.radar-layers-panel.open {

    transform: translateX(0);

    pointer-events: auto;
}

/* =========================================
   ЗАГОЛОВОК ПАНЕЛИ
   ========================================= */

.radar-panel-header {

    height: 58px;

    padding: 0 14px;

    display: flex;

    align-items: center;

    justify-content: space-between;

    border-bottom: 1px solid #334155;

    font-size: 15px;

    font-weight: 600;
}

.radar-panel-close {

    width: 36px;
    height: 36px;

    padding: 0;

    border-radius: 9px;

    font-size: 24px;

    line-height: 1;

    background: #1e293b;

    color: #cbd5e1;

    border: 1px solid #334155;

    touch-action: manipulation;
}

/* =========================================
   СЕКЦИИ
   ========================================= */

.radar-layer-section {

    padding: 15px 14px;

    border-bottom: 1px solid #1e293b;
}

.radar-layer-title {

    font-size: 10px;

    font-weight: 700;

    letter-spacing: .8px;

    color: #64748b;

    margin-bottom: 10px;
}

.radar-layer-row {

    display: flex;

    align-items: center;

    min-height: 45px;

    color: #cbd5e1;

    font-size: 13px;

    cursor: pointer;
}

.radar-layer-row span {

    display: flex;

    align-items: center;

    gap: 10px;
}

.radar-layer-row input {

    width: 19px;
    height: 19px;

    accent-color: #0ea5e9;
}

/* =========================================
   СТАТУС
   ========================================= */

.radar-stations-status {

    padding: 14px;

    color: #64748b;

    font-size: 11px;

    line-height: 1.5;
}

/* =========================================
   НИЖНИЙ БЛОК
   ========================================= */

.bottom-bar {

    position: fixed;

    left: 12px;
    right: 12px;

    bottom: 14px;

    height: 40px;

    background:
        rgba(15, 23, 42, .92);

    border: 1px solid #334155;

    border-radius: 12px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 13px;

    color: #94a3b8;

    z-index: 1500;

    backdrop-filter: blur(8px);
}

.bottom-bar strong {

    color: #e2e8f0;

    font-weight: 500;

    margin-left: 4px;
}

/* =========================================
   ЛЕГЕНДА
   ========================================= */

.legend {

    position: fixed;

    top: 56px;

    left: 12px;
    right: 12px;

    max-height: 0;

    overflow: hidden;

    background:
        rgba(15, 23, 42, .97);

    border: 1px solid #334155;

    border-radius: 12px;

    z-index: 2500;

    opacity: 0;

    transition:
        max-height .28s ease,
        opacity .2s ease,
        padding .28s ease;

    backdrop-filter: blur(10px);
}

.legend.open {

    max-height: 350px;

    padding: 12px 14px 14px;

    opacity: 1;
}

.legend-title {

    font-size: 13px;

    font-weight: 600;

    color: #38bdf8;

    margin-bottom: 10px;
}

.legend-grid {

    display: grid;

    grid-template-columns:
        1fr 1fr;

    gap: 5px 10px;

    font-size: 11.5px;
}

.legend-item {

    display: flex;

    align-items: center;

    gap: 7px;

    color: #cbd5e1;
}

.swatch {

    width: 13px;
    height: 13px;

    border-radius: 3px;

    flex-shrink: 0;

    border:
        1px solid
        rgba(255,255,255,.12);
}

</style>
</head>

<body>

<!-- =========================================
     ШАПКА
     ========================================= -->

<div class="header">

    <div class="title">
        Радар <span>/ модель</span>
    </div>

    <div class="header-btns">

        <button
            id="btnLegend"
            onclick="toggleLegend()">
            Легенда
        </button>

        <button
            onclick="refreshGif()">
            Обновить
        </button>

    </div>

</div>


<!-- =========================================
     ЛЕГЕНДА
     ========================================= -->

<div
    class="legend"
    id="legend">

    <div class="legend-title">
        Радар
    </div>

    <div class="legend-grid">

        <div class="legend-item">
            <div
                class="swatch"
                style="background:#86efac">
            </div>
            Осадки слабые
        </div>

        <div class="legend-item">
            <div
                class="swatch"
                style="background:#22c55e">
            </div>
            Осадки умеренные
        </div>

        <div class="legend-item">
            <div
                class="swatch"
                style="background:#15803d">
            </div>
            Осадки сильные
        </div>

        <div class="legend-item">
            <div
                class="swatch"
                style="background:#60a5fa">
            </div>
            Ливень слабый
        </div>

        <div class="legend-item">
            <div
                class="swatch"
                style="background:#3b82f6">
            </div>
            Ливень умеренный
        </div>

        <div class="legend-item">
            <div
                class="swatch"
                style="background:#1d4ed8">
            </div>
            Ливень сильный
        </div>

        <div class="legend-item">
            <div
                class="swatch"
                style="background:#fb923c">
            </div>
            Гроза
        </div>

        <div class="legend-item">
            <div
                class="swatch"
                style="background:#ef4444">
            </div>
            Сильная гроза
        </div>

    </div>

</div>


<!-- =========================================
     ОСНОВНАЯ ОБЛАСТЬ
     ========================================= -->

<div
    class="viewport"
    id="viewport">


    <!-- =====================================
         КНОПКА СЛОЁВ
         ===================================== -->

    <button
        id="radarLayersButton"
        class="radar-layers-button">

        ☰

    </button>


    <!-- =====================================
         LIBREWXR
         ===================================== -->

    <div
        id="libreMap">
    </div>


    <!-- =====================================
         СТАРАЯ GIF
         ===================================== -->

    <img
        id="radar"
        src="https://meteoinfo.ru/hmc-output/rmap/phenomena.gif"
        alt="Радар">


    <!-- =====================================
         ПАНЕЛЬ СЛОЁВ
         ===================================== -->

    <div
        id="radarLayersPanel"
        class="radar-layers-panel">


        <div
            class="radar-panel-header">

            <span>
                Слои
            </span>

            <button
                id="closeRadarPanel"
                class="radar-panel-close">

                ×

            </button>

        </div>


        <!-- =================================
             РАДАР
             ================================= -->

        <div
            class="radar-layer-section">

            <div
                class="radar-layer-title">

                РАДАР

            </div>


            <label
                class="radar-layer-row">

                <span>

                    <input
                        type="checkbox"
                        id="radarModelToggle">

                    <span>
                        Радар / модель
                    </span>

                </span>

            </label>


            <label
                class="radar-layer-row">

                <span>

                    <input
                        type="checkbox"
                        id="radarGifToggle">

                    <span>
                        Радарная GIF
                    </span>

                </span>

            </label>

        </div>


        <!-- =================================
             СТАНЦИИ
             ================================= -->

        <div
            class="radar-layer-section">

            <div
                class="radar-layer-title">

                СТАНЦИИ

            </div>


            <label
                class="radar-layer-row">

                <span>

                    <input
                        type="checkbox"
                        id="radarCoverageToggle">

                    <span>
                        Зоны покрытия
                    </span>

                </span>

            </label>


            <label
                class="radar-layer-row">

                <span>

                    <input
                        type="checkbox"
                        id="radarStationsToggle">

                    <span>
                        Радарные станции
                    </span>

                </span>

            </label>

        </div>


        <div
            id="radarStationsStatus"
            class="radar-stations-status">

            LibreWXR: готов

        </div>

    </div>

</div>


<!-- =========================================
     НИЖНЯЯ ПАНЕЛЬ
     ========================================= -->

<div class="bottom-bar">

    Обновлено:

    <strong id="updateTime">
        —
    </strong>

</div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================================
   ОСНОВНЫЕ ЭЛЕМЕНТЫ
   ========================================= */

const img =
    document.getElementById('radar');

const viewport =
    document.getElementById('viewport');

const libreMapElement =
    document.getElementById('libreMap');

const radarLayersButton =
    document.getElementById('radarLayersButton');

const radarLayersPanel =
    document.getElementById('radarLayersPanel');

const closeRadarPanel =
    document.getElementById('closeRadarPanel');

const radarModelToggle =
    document.getElementById('radarModelToggle');

const radarGifToggle =
    document.getElementById('radarGifToggle');

const updateTimeEl =
    document.getElementById('updateTime');


/* =========================================
   СОСТОЯНИЕ
   ========================================= */

let libreMap = null;

let libreRadarLayer = null;

let libreInitialized = false;


/* =========================================
   GIF
   ========================================= */

function refreshGif() {

    img.src =
        'https://meteoinfo.ru/hmc-output/rmap/phenomena.gif?t='
        + Date.now();

    updateTime();

}


/* =========================================
   ВРЕМЯ
   ========================================= */

function updateTime() {

    const now =
        new Date();

    const h =
        String(now.getHours())
        .padStart(2, '0');

    const m =
        String(now.getMinutes())
        .padStart(2, '0');

    updateTimeEl.textContent =
        h + ':' + m;
}


/* =========================================
   ЛЕГЕНДА
   ========================================= */

let legendOpen = false;

function toggleLegend() {

    legendOpen =
        !legendOpen;

    document
        .getElementById('legend')
        .classList
        .toggle(
            'open',
            legendOpen
        );

    document
        .getElementById('btnLegend')
        .classList
        .toggle(
            'active',
            legendOpen
        );
}


/* =========================================
   ПАНЕЛЬ СЛОЁВ
   ========================================= */

radarLayersButton.addEventListener(
    'pointerdown',
    function(e) {

        e.preventDefault();

        e.stopPropagation();

        radarLayersPanel
            .classList
            .add('open');

    }
);


closeRadarPanel.addEventListener(
    'pointerdown',
    function(e) {

        e.preventDefault();

        e.stopPropagation();

        radarLayersPanel
            .classList
            .remove('open');

    }
);


/* =========================================
   LIBREWXR КАРТА
   ========================================= */

function createLibreMap() {

    if (libreMap)
        return;


    libreMap = L.map(
        'libreMap',
        {
            zoomControl: false,

            attributionControl: true,

            worldCopyJump: true,

            minZoom: 2,

            maxZoom: 12
        }
    );


    libreMap.setView(
        [55, 50],
        4
    );


    /* Тёмная карта мира */

    L.tileLayer(

        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',

        {

            maxZoom: 19,

            subdomains:
                'abcd',

            attribution:
                '&copy; OpenStreetMap &copy; CARTO'

        }

    ).addTo(libreMap);


    libreInitialized = true;


    setTimeout(
        function() {

            libreMap.invalidateSize();

        },
        200
    );
}


/* =========================================
   ЗАГРУЗКА LIBREWXR
   ========================================= */

async function loadLibreWXR() {

    createLibreMap();


    const status =
        document.getElementById(
            'radarStationsStatus'
        );


    status.textContent =
        'LibreWXR: загрузка...';


    try {

        const response =
            await fetch(
                'https://api.librewxr.net/public/weather-maps.json',
                {
                    cache: 'no-store'
                }
            );


        if (!response.ok) {

            throw new Error(
                'HTTP ' +
                response.status
            );

        }


        const data =
            await response.json();


        /*
         * Берём последний доступный
         * радарный кадр.
         */

        const frames =
            data.radar &&
            data.radar.past
                ? data.radar.past
                : [];


        if (!frames.length) {

            status.textContent =
                'LibreWXR: радарные данные отсутствуют';

            return;
        }


        const frame =
            frames[
                frames.length - 1
            ];


        /*
         * Удаляем старый слой
         */

        if (libreRadarLayer) {

            libreMap.removeLayer(
                libreRadarLayer
            );

            libreRadarLayer = null;
        }


        /*
         * Создаём слой осадков.
         */

        const tileUrl =
            data.host +
            frame.path +
            '/256/{z}/{x}/{y}/10/1_1.png';


        libreRadarLayer =
            L.tileLayer(
                tileUrl,
                {

                    opacity: 1,

                    maxZoom: 12,

                    tileSize: 256,

                    crossOrigin: true

                }
            );


        libreRadarLayer.addTo(
            libreMap
        );


        status.textContent =
            'LibreWXR: радар загружен';


        setTimeout(
            function() {

                libreMap.invalidateSize();

            },
            150
        );


    } catch(error) {

        console.error(
            'LibreWXR:',
            error
        );


        status.textContent =
            'LibreWXR: ошибка загрузки';
    }
}


/* =========================================
   ОТКРЫТЬ РАДАР / МОДЕЛЬ
   ========================================= */

async function openRadarModel() {

    /*
     * Скрываем GIF
     */

    img.style.display =
        'none';


    /*
     * Показываем карту
     */

    libreMapElement
        .classList
        .add('open');


    /*
     * Загружаем карту
     */

    await loadLibreWXR();


    /*
     * Обновляем размер
     */

    if (libreMap) {

        setTimeout(
            function() {

                libreMap.invalidateSize();

            },
            100
        );
    }
}


/* =========================================
   ОТКРЫТЬ GIF
   ========================================= */

function openRadarGif() {

    /*
     * Скрываем LibreWXR
     */

    libreMapElement
        .classList
        .remove('open');


    /*
     * Показываем GIF
     */

    img.style.display =
        'block';


    /*
     * Если карта была создана —
     * оставляем её загруженной.
     */

    updateTime();
}


/* =========================================
   ПЕРЕКЛЮЧАТЕЛЬ
   ========================================= */

radarModelToggle.addEventListener(
    'change',
    async function() {

        if (this.checked) {

            /*
             * Выключаем GIF
             */

            radarGifToggle.checked =
                false;


            /*
             * Открываем LibreWXR
             */

            await openRadarModel();

        }

    }
);


radarGifToggle.addEventListener(
    'change',
    function() {

        if (this.checked) {

            /*
             * Выключаем
             * Радар / модель
             */

            radarModelToggle.checked =
                false;


            /*
             * Открываем GIF
             */

            openRadarGif();

        }

    }
);


/* =========================================
   СТАРТ
   ========================================= */

/*
 * По умолчанию показываем GIF.
 */

radarGifToggle.checked =
    true;

radarModelToggle.checked =
    false;

openRadarGif();

updateTime();


/* =========================================
   АВТООБНОВЛЕНИЕ GIF
   ========================================= */

setInterval(
    function() {

        /*
         * Обновляем GIF только если
         * она сейчас активна.
         */

        if (
            radarGifToggle.checked
        ) {

            refreshGif();

        }

    },
    4 * 60 * 1000
);


/* =========================================
   ЗАКРЫТИЕ ПАНЕЛИ ПРИ КЛИКЕ
   ВНЕ ПАНЕЛИ
   ========================================= */

viewport.addEventListener(
    'pointerdown',
    function(e) {

        if (
            radarLayersPanel
                .classList
                .contains('open')
            &&
            !radarLayersPanel
                .contains(e.target)
            &&
            e.target !== radarLayersButton
        ) {

            radarLayersPanel
                .classList
                .remove('open');

        }

    }
);

</script>

</body>
</html>
