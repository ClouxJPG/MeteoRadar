<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Радар — Европейская Россия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        html, body {
            height: 100%;
            background: #0b1220;
            color: #e2e8f0;
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(11, 18, 32, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 40;
            border-bottom: 1px solid #1e293b;
        }
        .title { font-size: 15px; font-weight: 600; }
        .title span { color: #38bdf8; }

        button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
        }
        button:active { background: #334155; }

        .viewport {
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            background: #0b1220;
        }

        #radar {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            will-change: transform;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Радар <span>Европ. Россия</span></div>
        <button onclick="refresh()">Обновить</button>
    </div>

    <div class="viewport" id="viewport">
        <img id="radar" src="https://meteoinfo.ru/hmc-output/rmap/phenomena.gif" alt="Радар">
    </div>

<script>
    const img = document.getElementById('radar');
    const viewport = document.getElementById('viewport');

    // Текущее состояние картинки
    let scale = 1;
    let rotation = 0; // градусы
    let tx = 0;
    let ty = 0;

    // Для жеста двумя пальцами
    let active = false;
    let startScale = 1;
    let startRotation = 0;
    let startTx = 0;
    let startTy = 0;
    let startDist = 0;
    let startAngle = 0;
    let focalX = 0; // точка между пальцами в координатах viewport (фиксируется при начале жеста)
    let focalY = 0;

    // Для одного пальца
    let panning = false;
    let lastPanX = 0;
    let lastPanY = 0;

    function apply() {
        const rad = rotation * Math.PI / 180;
        const a = scale * Math.cos(rad);
        const b = scale * Math.sin(rad);
        img.style.transform = `matrix(${a}, ${b}, ${-b}, ${a}, ${tx}, ${ty})`;
    }

    function refresh() {
        img.src = 'https://meteoinfo.ru/hmc-output/rmap/phenomena.gif?t=' + Date.now();
    }

    function getPoint(touch) {
        const rect = viewport.getBoundingClientRect();
        return {
            x: touch.clientX - rect.left,
            y: touch.clientY - rect.top
        };
    }

    function distance(p1, p2) {
        return Math.hypot(p2.x - p1.x, p2.y - p1.y);
    }

    function angle(p1, p2) {
        return Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
    }

    viewport.addEventListener('touchstart', function (e) {
        e.preventDefault();

        if (e.touches.length === 1) {
            // Один палец — начинаем перемещение
            active = false;
            panning = true;
            const p = getPoint(e.touches[0]);
            lastPanX = p.x;
            lastPanY = p.y;
        }
        else if (e.touches.length === 2) {
            // Два пальца — фиксируем точку между ними
            panning = false;
            active = true;

            const p1 = getPoint(e.touches[0]);
            const p2 = getPoint(e.touches[1]);

            // Фиксируем фокус (середина между пальцами)
            focalX = (p1.x + p2.x) / 2;
            focalY = (p1.y + p2.y) / 2;

            startDist = distance(p1, p2);
            startAngle = angle(p1, p2);

            startScale = scale;
            startRotation = rotation;
            startTx = tx;
            startTy = ty;
        }
    }, { passive: false });

    viewport.addEventListener('touchmove', function (e) {
        e.preventDefault();

        if (panning && e.touches.length === 1) {
            const p = getPoint(e.touches[0]);
            tx += p.x - lastPanX;
            ty += p.y - lastPanY;
            lastPanX = p.x;
            lastPanY = p.y;
            apply();
            return;
        }

        if (active && e.touches.length === 2) {
            const p1 = getPoint(e.touches[0]);
            const p2 = getPoint(e.touches[1]);

            const newDist = distance(p1, p2);
            const newAngle = angle(p1, p2);

            // Новый масштаб и угол
            let newScale = startScale * (newDist / startDist);
            newScale = Math.max(0.25, Math.min(newScale, 18));

            const newRotation = startRotation + (newAngle - startAngle);

            // === Сохраняем точку фокуса неподвижной ===
            // 1. Находим, какая точка изображения находилась под focal в начале жеста
            const rad0 = startRotation * Math.PI / 180;
            const cos0 = Math.cos(rad0);
            const sin0 = Math.sin(rad0);

            // Вектор от startTx/Ty до фокуса
            const dx = focalX - startTx;
            const dy = focalY - startTy;

            // Переводим в локальные координаты изображения
            const localX = ( dx * cos0 + dy * sin0) / startScale;
            const localY = (-dx * sin0 + dy * cos0) / startScale;

            // 2. Применяем новый поворот и масштаб, оставляя эту локальную точку под тем же focal
            const rad1 = newRotation * Math.PI / 180;
            const cos1 = Math.cos(rad1);
            const sin1 = Math.sin(rad1);

            tx = focalX - (localX * newScale * cos1 - localY * newScale * sin1);
            ty = focalY - (localX * newScale * sin1 + localY * newScale * cos1);

            scale = newScale;
            rotation = newRotation;

            apply();
        }
    }, { passive: false });

    viewport.addEventListener('touchend', function (e) {
        if (e.touches.length < 2) {
            active = false;
        }
        if (e.touches.length === 0) {
            panning = false;
        }
        if (e.touches.length === 1) {
            // Перешли с двух пальцев на один
            panning = true;
            const p = getPoint(e.touches[0]);
            lastPanX = p.x;
            lastPanY = p.y;
        }
    });

    viewport.addEventListener('touchcancel', function () {
        active = false;
        panning = false;
    });

    // Автообновление
    setInterval(refresh, 4 * 60 * 1000);

    // Центрирование при загрузке
    img.onload = function () {
        setTimeout(function () {
            const rect = viewport.getBoundingClientRect();
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            if (!w || !h) return;

            scale = Math.min(rect.width / w, rect.height / h) * 0.95;
            tx = (rect.width - w * scale) / 2;
            ty = (rect.height - h * scale) / 2;
            rotation = 0;
            apply();
        }, 60);
    };

    apply();
</script>
</body>
</html>
