<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Радар осадков — Европейская часть России</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            height: 100%;
            background: #0f172a;
            color: #e2e8f0;
            font-family: -apple-system, system-ui, sans-serif;
        }
        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 52px;
            background: rgba(15, 23, 42, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 100;
            border-bottom: 1px solid #334155;
        }
        .title { font-size: 16px; font-weight: 600; }
        .title span { color: #38bdf8; }
        .btn {
            background: #1e293b;
            border: 1px solid #475569;
            color: #e2e8f0;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 14px;
            cursor: pointer;
        }
        .content {
            position: absolute;
            top: 52px;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px;
            overflow: auto;
        }
        .radar-wrap {
            max-width: 100%;
            max-height: 100%;
            background: #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .radar-wrap img {
            display: block;
            max-width: 100%;
            height: auto;
        }
        .info {
            margin-top: 12px;
            font-size: 13px;
            color: #94a3b8;
            text-align: center;
            line-height: 1.4;
            max-width: 480px;
        }
        .info a { color: #38bdf8; }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Радар <span>Европейская Россия</span></div>
        <button class="btn" onclick="refreshRadar()">Обновить</button>
    </div>

    <div class="content">
        <div class="radar-wrap">
            <img id="radar" src="https://meteoinfo.ru/hmc-output/rmap/phenomena.gif" alt="Радар осадков">
        </div>
        <div class="info">
            Реальные данные радаров Росгидромета<br>
            (Центральная аэрологическая обсерватория)<br>
            Последние 3 часа · Обновляется автоматически<br>
            <a href="https://meteoinfo.ru/radanim" target="_blank">Источник</a>
        </div>
    </div>

<script>
    function refreshRadar() {
        const img = document.getElementById('radar');
        // Добавляем случайный параметр, чтобы браузер не брал из кэша
        img.src = 'https://meteoinfo.ru/hmc-output/rmap/phenomena.gif?t=' + Date.now();
    }

    // Автообновление каждые 5 минут
    setInterval(refreshRadar, 5 * 60 * 1000);
</script>
</body>
</html>
