<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Радар — Европейская Россия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        html, body {
            height: 100%;
            background: #0b1220;
            color: #e2e8f0;
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(11, 18, 32, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 40;
            border-bottom: 1px solid #1e293b;
        }
        .title { font-size: 15px; font-weight: 600; }
        .title span { color: #38bdf8; }

        button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
        }
        button:active { background: #334155; }

        .viewport {
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            background: #0b1220;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #radar {
            max-width: none;
            max-height: none;
            transform-origin: 0 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
            will-change: transform;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Радар <span>Европ. Россия</span></div>
        <button onclick="refresh()">Обновить</button>
    </div>

    <div class="viewport" id="viewport">
        <img id="radar" src="https://meteoinfo.ru/hmc-output/rmap/phenomena.gif" alt="Радар">
    </div>

<script>
    const img = document.getElementById('radar');
    const viewport = document.getElementById('viewport');

    let scale = 1;
    let rotation = 0;
    let posX = 0;
    let posY = 0;

    let mode = null;
    let startX = 0, startY = 0;
    let startPosX = 0, startPosY = 0;
    let startDist = 0;
    let startAngle = 0;
    let startScale = 1;
    let startRotation = 0;
    let pinchCenterX = 0, pinchCenterY = 0;

    function apply() {
        // transform-origin: 0 0 + translate + rotate + scale
        img.style.transform = `translate(${posX}px, ${posY}px) rotate(${rotation}deg) scale(${scale})`;
    }

    function refresh() {
        img.src = 'https://meteoinfo.ru/hmc-output/rmap/phenomena.gif?t=' + Date.now();
    }

    function getDistance(t1, t2) {
        const dx = t1.clientX - t2.clientX;
        const dy = t1.clientY - t2.clientY;
        return Math.hypot(dx, dy);
    }

    function getAngle(t1, t2) {
        return Math.atan2(t2.clientY - t1.clientY, t2.clientX - t1.clientX) * 180 / Math.PI;
    }

    function getMidpoint(t1, t2) {
        return {
            x: (t1.clientX + t2.clientX) / 2,
            y: (t1.clientY + t2.clientY) / 2
        };
    }

    // Переводим координаты экрана в координаты внутри viewport
    function screenToViewport(x, y) {
        const rect = viewport.getBoundingClientRect();
        return {
            x: x - rect.left,
            y: y - rect.top
        };
    }

    viewport.addEventListener('touchstart', (e) => {
        e.preventDefault();

        if (e.touches.length === 1) {
            mode = 'pan';
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            startPosX = posX;
            startPosY = posY;
        }
        else if (e.touches.length === 2) {
            mode = 'pinch';
            startDist = getDistance(e.touches[0], e.touches[1]);
            startAngle = getAngle(e.touches[0], e.touches[1]);
            startScale = scale;
            startRotation = rotation;
            startPosX = posX;
            startPosY = posY;

            const mid = getMidpoint(e.touches[0], e.touches[1]);
            const vp = screenToViewport(mid.x, mid.y);
            pinchCenterX = vp.x;
            pinchCenterY = vp.y;
        }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
        e.preventDefault();

        if (mode === 'pan' && e.touches.length === 1) {
            posX = startPosX + (e.touches[0].clientX - startX);
            posY = startPosY + (e.touches[0].clientY - startY);
            apply();
        }
        else if (mode === 'pinch' && e.touches.length === 2) {
            const dist = getDistance(e.touches[0], e.touches[1]);
            const newScale = Math.min(Math.max(startScale * (dist / startDist), 0.35), 14);

            // Зум относительно точки между пальцами
            const scaleRatio = newScale / startScale;

            // Смещение, чтобы точка под пальцами оставалась на месте
            posX = pinchCenterX - (pinchCenterX - startPosX) * scaleRatio;
            posY = pinchCenterY - (pinchCenterY - startPosY) * scaleRatio;

            scale = newScale;

            // Вращение
            const angle = getAngle(e.touches[0], e.touches[1]);
            rotation = startRotation + (angle - startAngle);

            apply();
        }
    }, { passive: false });

    viewport.addEventListener('touchend', (e) => {
        if (e.touches.length === 0) {
            mode = null;
        } else if (e.touches.length === 1) {
            mode = 'pan';
            startX = e.touches[0].clientX;
            startY = e.touches[0].clientY;
            startPosX = posX;
            startPosY = posY;
        }
    });

    // Автообновление
    setInterval(refresh, 4 * 60 * 1000);

    // Центрируем картинку при первой загрузке
    img.onload = () => {
        // Небольшая задержка, чтобы размеры успели примениться
        setTimeout(() => {
            const rect = viewport.getBoundingClientRect();
            const imgW = img.naturalWidth || img.width;
            const imgH = img.naturalHeight || img.height;

            // Начальный масштаб, чтобы картинка влезла
            const scaleX = rect.width / imgW;
            const scaleY = rect.height / imgH;
            scale = Math.min(scaleX, scaleY) * 0.98;

            posX = (rect.width - imgW * scale) / 2;
            posY = (rect.height - imgH * scale) / 2;
            apply();
        }, 50);
    };

    apply();
</script>
</body>
</html>
