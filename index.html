<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0,
maximum-scale=1.0, user-scalable=no">

<title>Радар / модель</title>

<link rel="stylesheet"
href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;

    background:#05070b;
    color:#e2e8f0;

    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    user-select:none;
    -webkit-user-select:none;
}

/* =========================================
   ШАПКА
========================================= */

.header{
    position:fixed;

    top:0;
    left:0;
    right:0;

    height:48px;

    background:rgba(7,11,18,.97);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 12px;

    z-index:1000;

    border-bottom:1px solid #1e293b;
}

.title{
    font-size:15px;
    font-weight:600;
}

.title span{
    color:#38bdf8;
}

.header-btns{
    display:flex;
    gap:8px;
}

button{
    background:#1e293b;

    border:1px solid #334155;

    color:#e2e8f0;

    padding:7px 12px;

    border-radius:8px;

    font-size:13px;

    -webkit-tap-highlight-color:transparent;
}

button:active{
    background:#334155;
}

button.active{
    background:#0ea5e9;
    border-color:#0ea5e9;
    color:#fff;
}

/* =========================================
   VIEWPORT
========================================= */

.viewport{
    position:fixed;

    top:48px;
    left:0;
    right:0;
    bottom:0;

    overflow:hidden;

    background:#05070b;

    touch-action:none;
}

/* =========================================
   GIF
========================================= */

#radar{
    position:absolute;

    top:0;
    left:0;

    max-width:none;
    max-height:none;

    transform-origin:0 0;

    pointer-events:none;

    z-index:5;

    will-change:transform;
}

/* =========================================
   LIBREWXR
========================================= */

#libreMap{
    position:absolute;

    inset:0;

    z-index:10;

    background:#05070b;

    display:none;

    touch-action:pan-x pan-y pinch-zoom;
}

#libreMap.open{
    display:block;
}

#libreMap .leaflet-tile{
    filter:
    brightness(.42)
    contrast(1.25)
    saturate(.55);
}

.leaflet-control-zoom{
    display:none!important;
}

/* =========================================
   РОССИЯ
========================================= */

#russiaOverlay{
    pointer-events:none;
}

/* =========================================
   КНОПКА СЛОЁВ
========================================= */

.radar-layers-button{

    position:absolute;

    right:12px;
    top:12px;

    width:44px;
    height:44px;

    padding:0;

    background:rgba(15,23,42,.96);

    border:1px solid #334155;

    border-radius:12px;

    color:#e2e8f0;

    font-size:21px;

    z-index:2000;

    display:flex;

    align-items:center;
    justify-content:center;

    pointer-events:auto;

    touch-action:manipulation;

    box-shadow:
    0 5px 20px rgba(0,0,0,.35);
}

/* =========================================
   ПАНЕЛЬ
========================================= */

.radar-layers-panel{

    position:absolute;

    top:0;
    right:0;

    width:300px;
    max-width:86vw;

    height:100%;

    background:rgba(10,15,25,.98);

    border-left:1px solid #334155;

    z-index:3000;

    transform:translateX(100%);

    transition:transform .28s ease;

    box-shadow:
    -10px 0 35px rgba(0,0,0,.45);

    overflow-y:auto;

    pointer-events:none;

    touch-action:auto;
}

.radar-layers-panel.open{

    transform:translateX(0);

    pointer-events:auto;
}

.radar-panel-header{

    height:58px;

    padding:0 14px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    border-bottom:1px solid #334155;

    font-size:15px;

    font-weight:600;
}

.radar-panel-close{

    width:36px;
    height:36px;

    padding:0;

    border-radius:9px;

    font-size:24px;

    line-height:1;

    background:#1e293b;

    color:#cbd5e1;

    border:1px solid #334155;

    touch-action:manipulation;
}

/* =========================================
   СЕКЦИИ
========================================= */

.radar-layer-section{

    padding:15px 14px;

    border-bottom:1px solid #1e293b;
}

.radar-layer-title{

    font-size:10px;

    font-weight:700;

    letter-spacing:.8px;

    color:#64748b;

    margin-bottom:10px;
}

.radar-layer-row{

    display:flex;

    align-items:center;

    min-height:45px;

    color:#cbd5e1;

    font-size:13px;

    cursor:pointer;
}

.radar-layer-row span{

    display:flex;

    align-items:center;

    gap:10px;
}

.radar-layer-row input{

    width:19px;
    height:19px;

    accent-color:#0ea5e9;
}

/* =========================================
   СТАТУС
========================================= */

.radar-stations-status{

    padding:14px;

    color:#64748b;

    font-size:11px;

    line-height:1.5;
}

/* =========================================
   НИЖНЯЯ ПАНЕЛЬ
========================================= */

.bottom-bar{

    position:fixed;

    left:12px;
    right:12px;

    bottom:14px;

    height:40px;

    background:rgba(15,23,42,.92);

    border:1px solid #334155;

    border-radius:12px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:13px;

    color:#94a3b8;

    z-index:1500;

    backdrop-filter:blur(8px);
}

.bottom-bar strong{

    color:#e2e8f0;

    font-weight:500;

    margin-left:4px;
}

/* =========================================
   ЛЕГЕНДА
========================================= */

.legend{

    position:fixed;

    top:56px;

    left:12px;
    right:12px;

    max-height:0;

    overflow:hidden;

    background:rgba(15,23,42,.97);

    border:1px solid #334155;

    border-radius:12px;

    z-index:2500;

    opacity:0;

    transition:
    max-height .28s ease,
    opacity .2s ease,
    padding .28s ease;

    backdrop-filter:blur(10px);
}

.legend.open{

    max-height:350px;

    padding:12px 14px 14px;

    opacity:1;
}

.legend-title{

    font-size:13px;

    font-weight:600;

    color:#38bdf8;

    margin-bottom:10px;
}

.legend-grid{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:5px 10px;

    font-size:11.5px;
}

.legend-item{

    display:flex;

    align-items:center;

    gap:7px;

    color:#cbd5e1;
}

.swatch{

    width:13px;
    height:13px;

    border-radius:3px;

    flex-shrink:0;

    border:
    1px solid
    rgba(255,255,255,.12);
}

</style>
</head>

<body>

<!-- =========================================
     HEADER
========================================= -->

<div class="header">

    <div class="title">
        Радар <span>/ модель</span>
    </div>

    <div class="header-btns">

        <button
        id="btnLegend"
        onclick="toggleLegend()">
        Легенда
        </button>

        <button
        onclick="refreshGif()">
        Обновить
        </button>

    </div>

</div>


<!-- =========================================
     ЛЕГЕНДА
========================================= -->

<div
class="legend"
id="legend">

    <div class="legend-title">
        Осадки
    </div>

    <div class="legend-grid">

        <div class="legend-item">
            <div
            class="swatch"

            </div>

        </div>

        <div class="legend-item">
            <div
            class="swatch"
            style="background:#22c55e">

        </div>

        <div class="legend-item">
            <div
            class="swatch"

        </div>

        <div class="legend-item">
            <div
            class="swatch"

        </div>

        <div class="legend-item">
            <div
            class="swatch"
            style="background:#3b82f6">

        </div>

        <div class="legend-item">
            <div
            class="swatch"
            style="background:#1d4ed8">
            </div>
            Ливень сильный
        </div>

        <div class="legend-item">
            <div
            class="swatch"

        </div>

        <div class="legend-item">
            <div
            class="swatch"

</div>


<!-- =========================================
     VIEWPORT
========================================= -->

<div
class="viewport"
id="viewport">


    <button
    id="radarLayersButton"
    class="radar-layers-button">

        ☰

    </button>


    <!-- LIBREWXR -->

    <div
    id="libreMap">
    </div>


    <!-- GIF -->

    <img
    id="radar"
    src="https://meteoinfo.ru/hmc-output/rmap/phenomena.gif"
    alt="Радар">


    <!-- =====================================
         ПАНЕЛЬ
    ====================================== -->

    <div
    id="radarLayersPanel"
    class="radar-layers-panel">


        <div
        class="radar-panel-header">

            <span>
                Слои
            </span>

            <button
            id="closeRadarPanel"
            class="radar-panel-close">

                ×

            </button>

        </div>


        <div
        class="radar-layer-section">

            <div
            class="radar-layer-title">

                РАДАР

            </div>


            <label
            class="radar-layer-row">

                <span>

                    <input
                    type="checkbox"
                    id="radarModelToggle">

                    <span>
                        Радар / модель
                    </span>

                </span>

            </label>


            <label
            class="radar-layer-row">

                <span>

                    <input
                    type="checkbox"
                    id="radarGifToggle">

                    <span>
                        Радарная GIF
                    </span>

                </span>

            </label>

        </div>


        <div
        class="radar-layer-section">

            <div
            class="radar-layer-title">

                СТАНЦИИ

            </div>


            <label
            class="radar-layer-row">

                <span>

                    <input
                    type="checkbox"
                    id="radarCoverageToggle">

                    <span>
                        Зоны покрытия
                    </span>

                </span>

            </label>


            <label
            class="radar-layer-row">

                <span>

                    <input
                    type="checkbox"
                    id="radarStationsToggle">

                    <span>
                        Радарные станции
                    </span>

                </span>

            </label>

        </div>


        <div
        id="radarStationsStatus"
        class="radar-stations-status">

            LibreWXR: готов

</div>


<div class="bottom-bar">

    Обновлено:

    <strong id="updateTime">
        —
    </strong>

</div>


<script
src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

/* =========================================
   ELEMENTS
========================================= */

const img =
document.getElementById('radar');

const viewport =
document.getElementById('viewport');

const libreMapElement =
document.getElementById('libreMap');

const radarLayersButton =
document.getElementById('radarLayersButton');

const radarLayersPanel =
document.getElementById('radarLayersPanel');

const closeRadarPanel =
document.getElementById('closeRadarPanel');

const radarModelToggle =
document.getElementById('radarModelToggle');

const radarGifToggle =
document.getElementById('radarGifToggle');

const updateTimeEl =
document.getElementById('updateTime');


/* =========================================
   LIBRE MAP
========================================= */

let libreMap = null;

let libreRadarLayer = null;

let russiaLayer = null;


/* =========================================
   GIF TRANSFORM
========================================= */

let gifScale = 1;

let gifRotation = 0;

let gifX = 0;

let gifY = 0;

let gifInitialized = false;

let gestureActive = false;

let gestureStartDistance = 0;

let gestureStartAngle = 0;

let gestureStartScale = 1;

let gestureStartRotation = 0;

let gestureStartX = 0;

let gestureStartY = 0;

let gestureStartCenterX = 0;

let gestureStartCenterY = 0;

let oneFingerActive = false;

let lastFingerX = 0;

let lastFingerY = 0;


/* =========================================
   APPLY GIF TRANSFORM
========================================= */

function applyGifTransform(){

    const rad =
    gifRotation * Math.PI / 180;

    const cos =
    Math.cos(rad);

    const sin =
    Math.sin(rad);

    const a =
    gifScale * cos;

    const b =
    gifScale * sin;

    const c =
    -gifScale * sin;

    const d =
    gifScale * cos;

    img.style.transform =
    `matrix(${a},${b},${c},${d},${gifX},${gifY})`;
}


/* =========================================
   INITIAL GIF POSITION
========================================= */

function resetGifPosition(){

    const rect =
    viewport.getBoundingClientRect();

    const w =
    img.naturalWidth;

    const h =
    img.naturalHeight;

    if(!w || !h)
        return;

    gifScale =
    Math.min(
        rect.width / w,
        rect.height / h
    ) * .95;

    gifRotation = 0;

    gifX =
    (rect.width - w * gifScale) / 2;

    gifY =
    (rect.height - h * gifScale) / 2;

    applyGifTransform();

    gifInitialized = true;
}


/* =========================================
   GIF LOAD
========================================= */

img.onload = function(){

    setTimeout(
        resetGifPosition,
        50
    );

    updateTime();
};


/* =========================================
   TOUCH HELPERS
========================================= */

function getTouchPoint(touch){

    const rect =
    viewport.getBoundingClientRect();

    return {

        x:
        touch.clientX -
        rect.left,

        y:
        touch.clientY -
        rect.top
    };
}


function touchDistance(a,b){

    return Math.hypot(
        b.x-a.x,
        b.y-a.y
    );
}


function touchAngle(a,b){

    return Math.atan2(
        b.y-a.y,
        b.x-a.x
    ) * 180 / Math.PI;
}


/* =========================================
   GIF TOUCH START
========================================= */

viewport.addEventListener(
'touchstart',
function(e){

    if(
        radarGifToggle.checked &&
        !libreMapElement.classList.contains('open')
    ){

        if(e.touches.length === 1){

            e.preventDefault();

            oneFingerActive = true;

            const p =
            getTouchPoint(
                e.touches[0]
            );

            lastFingerX =
            p.x;

            lastFingerY =
            p.y;
        }


        if(e.touches.length === 2){

            e.preventDefault();

            oneFingerActive = false;

            const p1 =
            getTouchPoint(
                e.touches[0]
            );

            const p2 =
            getTouchPoint(
                e.touches[1]
            );


            gestureActive = true;


            gestureStartDistance =
            touchDistance(
                p1,
                p2
            );


            gestureStartAngle =
            touchAngle(
                p1,
                p2
            );


            gestureStartScale =
            gifScale;


            gestureStartRotation =
            gifRotation;


            gestureStartX =
            gifX;


            gestureStartY =
            gifY;


            gestureStartCenterX =
            (p1.x+p2.x)/2;


            gestureStartCenterY =
            (p1.y+p2.y)/2;
        }

    }

},
{passive:false}
);


/* =========================================
   GIF TOUCH MOVE
========================================= */

viewport.addEventListener(
'touchmove',
function(e){

    if(
        !radarGifToggle.checked ||
        libreMapElement.classList.contains('open')
    )
        return;


    if(e.touches.length === 1 && oneFingerActive){

        e.preventDefault();

        const p =
        getTouchPoint(
            e.touches[0]
        );


        gifX +=
        p.x-lastFingerX;


        gifY +=
        p.y-lastFingerY;


        lastFingerX =
        p.x;


        lastFingerY =
        p.y;


        applyGifTransform();

        return;
    }


    if(
        e.touches.length === 2 &&
        gestureActive
    ){

        e.preventDefault();


        const p1 =
        getTouchPoint(
            e.touches[0]
        );

        const p2 =
        getTouchPoint(
            e.touches[1]
        );


        const centerX =
        (p1.x+p2.x)/2;

        const centerY =
        (p1.y+p2.y)/2;


        const newDistance =
        touchDistance(
            p1,
            p2
        );


        const newAngle =
        touchAngle(
            p1,
            p2
        );


        if(
            gestureStartDistance > 0
        ){

            gifScale =
            gestureStartScale *
            (
                newDistance /
                gestureStartDistance
            );


            gifScale =
            Math.max(
                .15,
                Math.min(
                    gifScale,
                    20
                )
            );
        }


        gifRotation =
        gestureStartRotation +
        (
            newAngle -
            gestureStartAngle
        );


        /*
         * Двигаем изображение
         * вместе с центром жеста.
         */

        gifX =
        gestureStartX +
        (
            centerX -
            gestureStartCenterX
        );


        gifY =
        gestureStartY +
        (
            centerY -
            gestureStartCenterY
        );


        applyGifTransform();
    }

},
{passive:false}
);


/* =========================================
   TOUCH END
========================================= */

viewport.addEventListener(
'touchend',
function(e){

    if(e.touches.length === 0){

        oneFingerActive = false;

        gestureActive = false;
    }


    if(e.touches.length === 1){

        gestureActive = false;

        oneFingerActive = true;

        const p =
        getTouchPoint(
            e.touches[0]
        );

        lastFingerX =
        p.x;

        lastFingerY =
        p.y;
    }

},
{passive:false}
);


/* =========================================
   UPDATE TIME
========================================= */

function updateTime(){

    const now =
    new Date();

    updateTimeEl.textContent =
    String(now.getHours())
    .padStart(2,'0')
    + ':'
    +
    String(now.getMinutes())
    .padStart(2,'0');
}


/* =========================================
   REFRESH GIF
========================================= */

function refreshGif(){

    img.src =
    'https://meteoinfo.ru/hmc-output/rmap/phenomena.gif?t='
    + Date.now();

    updateTime();
}


/* =========================================
   LEGEND
========================================= */

let legendOpen = false;

function toggleLegend(){

    legendOpen =
    !legendOpen;

    document
    .getElementById('legend')
    .classList
    .toggle(
        'open',
        legendOpen
    );

    document
    .getElementById('btnLegend')
    .classList
    .toggle(
        'active',
        legendOpen
    );
}


/* =========================================
   PANEL
========================================= */

radarLayersButton.addEventListener(
'pointerdown',
function(e){

    e.preventDefault();

    e.stopPropagation();

    radarLayersPanel
    .classList
    .add('open');

});


closeRadarPanel.addEventListener(
'pointerdown',
function(e){

    e.preventDefault();

    e.stopPropagation();

    radarLayersPanel
    .classList
    .remove('open');

});


/* =========================================
   LIBRE MAP
========================================= */

function createLibreMap(){

    if(libreMap)
        return;


    libreMap =
    L.map(
        'libreMap',
        {
            zoomControl:false,

            attributionControl:true,

            worldCopyJump:true,

            minZoom:2,

            maxZoom:12
        }
    );


    libreMap.setView(
        [55,50],
        4
    );


    /* Тёмная карта мира */

    L.tileLayer(
        'https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png',
        {
            maxZoom:19,

            subdomains:'abcd',

            attribution:
            '&copy; OpenStreetMap &copy; CARTO'
        }
    ).addTo(libreMap);


    /*
     * Граница России.
     * Используется GeoJSON с границей
     * России.
     */

    fetch(
        'https://raw.githubusercontent.com/codeforgermany/click_that_hood/main/public/data/russia.geojson'
    )
    .then(
        response => response.json()
    )
    .then(
        data => {

            russiaLayer =
            L.geoJSON(
                data,
                {
                    style:{
                        color:'#64748b',

                        weight:1.2,

                        opacity:.8,

                        fillColor:'#111820',

                        fillOpacity:.58
                    }
                }
            ).addTo(
                libreMap
            );

        }
    )
    .catch(
        error =>
        console.error(
            'Ошибка карты России:',
            error
        )
    );


    setTimeout(
        function(){

            libreMap.invalidateSize();

        },
        200
    );
}


/* =========================================
   LIBREWXR
========================================= */

async function loadLibreWXR(){

    createLibreMap();


    const status =
    document.getElementById(
        'radarStationsStatus'
    );


    status.textContent =
    'LibreWXR: загрузка...';


    try{

        const response =
        await fetch(
            'https://api.librewxr.net/public/weather-maps.json',
            {
                cache:'no-store'
            }
        );


        if(!response.ok)
            throw new Error(
                'HTTP '+response.status
            );


        const data =
        await response.json();


        const frames =
        data.radar &&
        data.radar.past
        ?
        data.radar.past
        :
        [];


        if(!frames.length){

            status.textContent =
            'LibreWXR: данные отсутствуют';

            return;
        }


        const frame =
        frames[
            frames.length-1
        ];


        if(libreRadarLayer){

            libreMap.removeLayer(
                libreRadarLayer
            );
        }


        const tileUrl =
        data.host +
        frame.path +
        '/256/{z}/{x}/{y}/10/1_1.png';


        libreRadarLayer =
        L.tileLayer(
            tileUrl,
            {
                opacity:1,

                maxZoom:12,

                tileSize:256
            }
        );


        libreRadarLayer.addTo(
            libreMap
        );


        status.textContent =
        'LibreWXR: радар загружен';


        setTimeout(
            function(){

                libreMap.invalidateSize();

            },
            150
        );


    }catch(error){

        console.error(
            'LibreWXR:',
            error
        );


        status.textContent =
        'LibreWXR: ошибка загрузки';
    }
}


/* =========================================
   ОТКРЫТЬ РАДАР / МОДЕЛЬ
========================================= */

async function openRadarModel(){

    img.style.display =
    'none';


    libreMapElement
    .classList
    .add('open');


    await loadLibreWXR();


    if(libreMap){

        setTimeout(
            function(){

                libreMap.invalidateSize();

            },
            100
        );
    }
}


/* =========================================
   ОТКРЫТЬ GIF
========================================= */

function openRadarGif(){

    libreMapElement
    .classList
    .remove('open');


    img.style.display =
    'block';


    if(!gifInitialized){

        if(img.complete){

            resetGifPosition();

        }

    }
}


/* =========================================
   ПЕРЕКЛЮЧАТЕЛИ
========================================= */

radarModelToggle.addEventListener(
'change',
async function(){

    if(this.checked){

        radarGifToggle.checked =
        false;

        await openRadarModel();

    }
});


radarGifToggle.addEventListener(
'change',
function(){

    if(this.checked){

        radarModelToggle.checked =
        false;

        openRadarGif();

    }

});


/* =========================================
   СТАНЦИИ
========================================= */

document
.getElementById('radarCoverageToggle')
.addEventListener(
'change',
function(){

    /*
     * Пока оставляем выключенным.
     * Подключим реальные зоны
     * покрытия следующим этапом.
     */

    this.checked = false;

});


document
.getElementById('radarStationsToggle')
.addEventListener(
'change',
function(){

    /*
     * Пока оставляем выключенным.
     * Подключим реальные ДМРЛ
     * следующим этапом.
     */

    this.checked = false;

});


/* =========================================
   СТАРТ
========================================= */

radarGifToggle.checked =
true;

radarModelToggle.checked =
false;

openRadarGif();

updateTime();


/* =========================================
   АВТООБНОВЛЕНИЕ GIF
========================================= */

setInterval(
function(){

    if(
        radarGifToggle.checked
    ){

        refreshGif();

    }

},
4 * 60 * 1000
);

</script>
