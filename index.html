<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Радар — Европейская Россия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        html, body {
            height: 100%;
            background: #0b1220;
            color: #e2e8f0;
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(11, 18, 32, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            z-index: 50;
            border-bottom: 1px solid #1e293b;
        }
        .title { font-size: 15px; font-weight: 600; }
        .title span { color: #38bdf8; }

        .header-btns { display: flex; gap: 8px; }
        button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 6px 12px;
            border-radius: 8px;
            font-size: 13px;
        }
        button:active { background: #334155; }
        button.active { background: #0ea5e9; border-color: #0ea5e9; color: #fff; }

        .viewport {
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            background: #0b1220;
        }

        #radar {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            will-change: transform;
            pointer-events: none;
        }

        .bottom-bar {
            position: fixed;
            left: 12px;
            right: 12px;
            bottom: 14px;
            height: 40px;
            background: rgba(15, 23, 42, 0.92);
            border: 1px solid #334155;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            color: #94a3b8;
            z-index: 45;
            backdrop-filter: blur(8px);
        }
        .bottom-bar strong {
            color: #e2e8f0;
            font-weight: 500;
            margin-left: 4px;
        }

        .legend {
            position: fixed;
            top: 48px;
            left: 12px;
            right: 12px;
            max-height: 0;
            overflow: hidden;
            background: rgba(15, 23, 42, 0.96);
            border: 1px solid #334155;
            border-radius: 12px;
            z-index: 48;
            transition: max-height 0.28s ease, padding 0.28s ease, opacity 0.2s ease;
            opacity: 0;
            backdrop-filter: blur(10px);
        }
        .legend.open {
            max-height: 420px;
            padding: 12px 14px 14px;
            opacity: 1;
            margin-top: 8px;
        }

        .legend-title {
            font-size: 13px;
            font-weight: 600;
            color: #38bdf8;
            margin-bottom: 10px;
        }

        .legend-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4px 12px;
            font-size: 12px;
        }
        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cbd5e1;
            line-height: 1.25;
        }
        .swatch {
            width: 14px;
            height: 14px;
            border-radius: 3px;
            flex-shrink: 0;
            border: 1px solid rgba(255,255,255,0.15);
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Радар <span>Европ. Россия</span></div>
        <div class="header-btns">
            <button id="btnLegend" onclick="toggleLegend()">Легенда</button>
            <button onclick="refresh()">Обновить</button>
        </div>
    </div>

    <div class="legend" id="legend">
        <div class="legend-title">Метеорадар (официальная шкала)</div>
        <div class="legend-grid">
            <div class="legend-item"><div class="swatch" style="background:#b0b7c0"></div>Обл. в. ср. яр.</div>
            <div class="legend-item"><div class="swatch" style="background:#8ecae6"></div>Слоист. обл.</div>
            <div class="legend-item"><div class="swatch" style="background:#90ee90"></div>Ос. слаб.</div>
            <div class="legend-item"><div class="swatch" style="background:#32cd32"></div>Ос. умер.</div>
            <div class="legend-item"><div class="swatch" style="background:#228b22"></div>Ос. сильн.</div>
            <div class="legend-item"><div class="swatch" style="background:#ffe566"></div>Куч. обл.</div>
            <div class="legend-item"><div class="swatch" style="background:#4fc3f7"></div>Лив. слаб.</div>
            <div class="legend-item"><div class="swatch" style="background:#2196f3"></div>Лив. умер.</div>
            <div class="legend-item"><div class="swatch" style="background:#0d47a1"></div>Лив. сильн.</div>
            <div class="legend-item"><div class="swatch" style="background:#ffb74d"></div>Гроза (R)</div>
            <div class="legend-item"><div class="swatch" style="background:#ff8a80"></div>Гроза R)</div>
            <div class="legend-item"><div class="swatch" style="background:#e53935"></div>Гроза R</div>
            <div class="legend-item"><div class="swatch" style="background:#ff8a50"></div>Град слаб.</div>
            <div class="legend-item"><div class="swatch" style="background:#e07030"></div>Град умер.</div>
            <div class="legend-item"><div class="swatch" style="background:#8d4e1a"></div>Град сильн.</div>
            <div class="legend-item"><div class="swatch" style="background:#f48fb1"></div>Гроз+Шкв слаб.</div>
            <div class="legend-item"><div class="swatch" style="background:#ec407a"></div>Гроз+Шкв умер.</div>
            <div class="legend-item"><div class="swatch" style="background:#c2185b"></div>Гроз+Шкв сильн.</div>
            <div class="legend-item"><div class="swatch" style="background:#37474f"></div>Смерч</div>
        </div>
    </div>

    <div class="viewport" id="viewport">
        <img id="radar" src="https://meteoinfo.ru/hmc-output/rmap/phenomena.gif" alt="Радар">
    </div>

    <div class="bottom-bar">
        Обновлено:<strong id="updateTime">—</strong>
    </div>

<script>
    const img = document.getElementById('radar');
    const viewport = document.getElementById('viewport');
    const legend = document.getElementById('legend');
    const btnLegend = document.getElementById('btnLegend');
    const updateTimeEl = document.getElementById('updateTime');

    let scale = 1, rotation = 0, tx = 0, ty = 0;
    let active = false, panning = false;
    let startScale = 1, startRotation = 0, startTx = 0, startTy = 0;
    let startDist = 0, startAngle = 0, focalX = 0, focalY = 0;
    let lastPanX = 0, lastPanY = 0;
    let legendOpen = false;

    function apply() {
        const rad = rotation * Math.PI / 180;
        const a = scale * Math.cos(rad);
        const b = scale * Math.sin(rad);
        img.style.transform = `matrix(${a}, ${b}, ${-b}, ${a}, ${tx}, ${ty})`;
    }

    function formatTime(date) {
        return String(date.getHours()).padStart(2,'0') + ':' + String(date.getMinutes()).padStart(2,'0');
    }

    function setUpdateTime() {
        updateTimeEl.textContent = formatTime(new Date());
    }

    function refresh() {
        img.src = 'https://meteoinfo.ru/hmc-output/rmap/phenomena.gif?t=' + Date.now();
        setUpdateTime();
    }

    function toggleLegend() {
        legendOpen = !legendOpen;
        legend.classList.toggle('open', legendOpen);
        btnLegend.classList.toggle('active', legendOpen);
    }

    function getPoint(t) {
        const r = viewport.getBoundingClientRect();
        return { x: t.clientX - r.left, y: t.clientY - r.top };
    }
    function distance(a, b) { return Math.hypot(b.x - a.x, b.y - a.y); }
    function angle(a, b) { return Math.atan2(b.y - a.y, b.x - a.x) * 180 / Math.PI; }

    viewport.addEventListener('touchstart', e => {
        e.preventDefault();
        if (e.touches.length === 1) {
            active = false; panning = true;
            const p = getPoint(e.touches[0]);
            lastPanX = p.x; lastPanY = p.y;
        } else if (e.touches.length === 2) {
            panning = false; active = true;
            const p1 = getPoint(e.touches[0]), p2 = getPoint(e.touches[1]);
            focalX = (p1.x + p2.x) / 2; focalY = (p1.y + p2.y) / 2;
            startDist = distance(p1, p2); startAngle = angle(p1, p2);
            startScale = scale; startRotation = rotation;
            startTx = tx; startTy = ty;
        }
    }, { passive: false });

    viewport.addEventListener('touchmove', e => {
        e.preventDefault();
        if (panning && e.touches.length === 1) {
            const p = getPoint(e.touches[0]);
            tx += p.x - lastPanX; ty += p.y - lastPanY;
            lastPanX = p.x; lastPanY = p.y;
            apply();
            return;
        }
        if (active && e.touches.length === 2) {
            const p1 = getPoint(e.touches[0]), p2 = getPoint(e.touches[1]);
            let newScale = startScale * (distance(p1, p2) / startDist);
            newScale = Math.max(0.25, Math.min(newScale, 18));
            const newRotation = startRotation + (angle(p1, p2) - startAngle);

            const rad0 = startRotation * Math.PI / 180;
            const cos0 = Math.cos(rad0), sin0 = Math.sin(rad0);
            const dx = focalX - startTx, dy = focalY - startTy;
            const localX = (dx * cos0 + dy * sin0) / startScale;
            const localY = (-dx * sin0 + dy * cos0) / startScale;

            const rad1 = newRotation * Math.PI / 180;
            const cos1 = Math.cos(rad1), sin1 = Math.sin(rad1);
            tx = focalX - (localX * newScale * cos1 - localY * newScale * sin1);
            ty = focalY - (localX * newScale * sin1 + localY * newScale * cos1);

            scale = newScale; rotation = newRotation;
            apply();
        }
    }, { passive: false });

    viewport.addEventListener('touchend', e => {
        if (e.touches.length < 2) active = false;
        if (e.touches.length === 0) panning = false;
        if (e.touches.length === 1) {
            panning = true;
            const p = getPoint(e.touches[0]);
            lastPanX = p.x; lastPanY = p.y;
        }
    });

    viewport.addEventListener('touchcancel', () => { active = false; panning = false; });

    setInterval(refresh, 4 * 60 * 1000);

    img.onload = () => {
        setUpdateTime();
        setTimeout(() => {
            const rect = viewport.getBoundingClientRect();
            const w = img.naturalWidth, h = img.naturalHeight;
            if (!w || !h) return;
            scale = Math.min(rect.width / w, rect.height / h) * 0.95;
            tx = (rect.width - w * scale) / 2;
            ty = (rect.height - h * scale) / 2;
            rotation = 0;
            apply();
        }, 60);
    };

    setUpdateTime();
    apply();
</script>
</body>
</html>
