<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Радар — Европейская Россия</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        html, body {
            height: 100%;
            background: #0b1220;
            color: #e2e8f0;
            font-family: -apple-system, system-ui, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        .header {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 48px;
            background: rgba(11, 18, 32, 0.95);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 14px;
            z-index: 40;
            border-bottom: 1px solid #1e293b;
        }
        .title { font-size: 15px; font-weight: 600; }
        .title span { color: #38bdf8; }

        button {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 6px 14px;
            border-radius: 8px;
            font-size: 14px;
        }
        button:active { background: #334155; }

        .viewport {
            position: absolute;
            top: 48px;
            left: 0;
            right: 0;
            bottom: 0;
            overflow: hidden;
            background: #0b1220;
        }

        #radar {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            -ms-interpolation-mode: nearest-neighbor;
            will-change: transform;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="title">Радар <span>Европ. Россия</span></div>
        <button onclick="refresh()">Обновить</button>
    </div>

    <div class="viewport" id="viewport">
        <img id="radar" src="https://meteoinfo.ru/hmc-output/rmap/phenomena.gif" alt="Радар">
    </div>

<script>
    const img = document.getElementById('radar');
    const viewport = document.getElementById('viewport');

    // Состояние
    let scale = 1;
    let rotation = 0;   // в градусах
    let x = 0;          // смещение
    let y = 0;

    // Жесты
    let pointers = new Map();   // id → {x, y}
    let lastDist = 0;
    let lastAngle = 0;
    let lastMid = {x: 0, y: 0};
    let lastScale = 1;
    let lastRotation = 0;
    let lastX = 0;
    let lastY = 0;

    function apply() {
        img.style.transform = `matrix(${scale * Math.cos(rotation * Math.PI/180)}, ${scale * Math.sin(rotation * Math.PI/180)}, ${-scale * Math.sin(rotation * Math.PI/180)}, ${scale * Math.cos(rotation * Math.PI/180)}, ${x}, ${y})`;
    }

    function refresh() {
        img.src = 'https://meteoinfo.ru/hmc-output/rmap/phenomena.gif?t=' + Date.now();
    }

    function getDistance(p1, p2) {
        return Math.hypot(p2.x - p1.x, p2.y - p1.y);
    }

    function getAngle(p1, p2) {
        return Math.atan2(p2.y - p1.y, p2.x - p1.x) * 180 / Math.PI;
    }

    function getMidpoint(p1, p2) {
        return { x: (p1.x + p2.x) / 2, y: (p1.y + p2.y) / 2 };
    }

    function screenToLocal(sx, sy) {
        const rect = viewport.getBoundingClientRect();
        return { x: sx - rect.left, y: sy - rect.top };
    }

    // ===== Обработка касаний =====
    viewport.addEventListener('touchstart', (e) => {
        e.preventDefault();

        for (const t of e.changedTouches) {
            const p = screenToLocal(t.clientX, t.clientY);
            pointers.set(t.identifier, p);
        }

        if (pointers.size === 2) {
            const pts = [...pointers.values()];
            lastDist = getDistance(pts[0], pts[1]);
            lastAngle = getAngle(pts[0], pts[1]);
            lastMid = getMidpoint(pts[0], pts[1]);
            lastScale = scale;
            lastRotation = rotation;
            lastX = x;
            lastY = y;
        }
    }, { passive: false });

    viewport.addEventListener('touchmove', (e) => {
        e.preventDefault();

        for (const t of e.changedTouches) {
            const p = screenToLocal(t.clientX, t.clientY);
            pointers.set(t.identifier, p);
        }

        if (pointers.size === 1) {
            // Один палец — перемещение
            const t = e.changedTouches[0];
            const p = screenToLocal(t.clientX, t.clientY);
            const prev = pointers.get(t.identifier);
            // prev уже обновлён, поэтому используем разницу от предыдущего кадра через last
            // Для простоты делаем относительное смещение
        }

        if (pointers.size === 1) {
            // Pan
            const pts = [...pointers.values()];
            // Чтобы pan работал плавно, запоминаем предыдущую позицию
            if (!viewport._lastPan) {
                viewport._lastPan = pts[0];
                return;
            }
            const dx = pts[0].x - viewport._lastPan.x;
            const dy = pts[0].y - viewport._lastPan.y;
            x += dx;
            y += dy;
            viewport._lastPan = pts[0];
            apply();
        }
        else if (pointers.size >= 2) {
            viewport._lastPan = null;
            const pts = [...pointers.values()].slice(0, 2);

            const dist = getDistance(pts[0], pts[1]);
            const angle = getAngle(pts[0], pts[1]);
            const mid = getMidpoint(pts[0], pts[1]);

            // Новый масштаб
            let newScale = lastScale * (dist / lastDist);
            newScale = Math.min(Math.max(newScale, 0.3), 16);

            // Новое вращение
            const newRotation = lastRotation + (angle - lastAngle);

            // === Главное: зум и вращение относительно точки между пальцами ===
            // 1. Переводим mid в локальные координаты изображения до трансформации
            const cos = Math.cos(lastRotation * Math.PI / 180);
            const sin = Math.sin(lastRotation * Math.PI / 180);

            // Точка mid в системе изображения (до текущего жеста)
            const dx = mid.x - lastX;
            const dy = mid.y - lastY;
            const localX = (dx * cos + dy * sin) / lastScale;
            const localY = (-dx * sin + dy * cos) / lastScale;

            // 2. Применяем новый масштаб и поворот
            const cos2 = Math.cos(newRotation * Math.PI / 180);
            const sin2 = Math.sin(newRotation * Math.PI / 180);

            x = mid.x - (localX * newScale * cos2 - localY * newScale * sin2);
            y = mid.y - (localX * newScale * sin2 + localY * newScale * cos2);

            scale = newScale;
            rotation = newRotation;

            apply();
        }
    }, { passive: false });

    viewport.addEventListener('touchend', (e) => {
        for (const t of e.changedTouches) {
            pointers.delete(t.identifier);
        }
        viewport._lastPan = null;

        // Обновляем last-значения, если осталось 2 пальца
        if (pointers.size === 2) {
            const pts = [...pointers.values()];
            lastDist = getDistance(pts[0], pts[1]);
            lastAngle = getAngle(pts[0], pts[1]);
            lastMid = getMidpoint(pts[0], pts[1]);
            lastScale = scale;
            lastRotation = rotation;
            lastX = x;
            lastY = y;
        }
    });

    viewport.addEventListener('touchcancel', (e) => {
        pointers.clear();
        viewport._lastPan = null;
    });

    // Автообновление
    setInterval(refresh, 4 * 60 * 1000);

    // Центрируем при загрузке
    img.onload = () => {
        setTimeout(() => {
            const rect = viewport.getBoundingClientRect();
            const w = img.naturalWidth;
            const h = img.naturalHeight;
            if (!w || !h) return;

            scale = Math.min(rect.width / w, rect.height / h) * 0.96;
            x = (rect.width - w * scale) / 2;
            y = (rect.height - h * scale) / 2;
            rotation = 0;
            apply();
        }, 80);
    };

    apply();
</script>
</body>
</html>
