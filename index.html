<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nowcast Radar Test</title>

<style>
body{
    margin:0;
    padding:20px;
    background:#111;
    color:#fff;
    font-family:Arial,sans-serif;
}

button{
    width:100%;
    padding:15px;
    border:0;
    border-radius:10px;
    background:#2878ff;
    color:white;
    font-size:17px;
}

#status{
    margin-top:20px;
    padding:15px;
    background:#1d1d1d;
    border-radius:10px;
    white-space:pre-wrap;
    word-break:break-word;
}
</style>
</head>

<body>

<h2>Nowcast Radar Test</h2>

<button onclick="loadRadar()">Получить данные радара</button>

<div id="status">Нажми кнопку.</div>

<script>

async function loadRadar(){

    const status = document.getElementById("status");

    status.textContent = "Получаем token...";

    try {

        // 1. Получаем token
        const tokenResponse = await fetch("/get_token");

        if(!tokenResponse.ok){
            throw new Error(
                "get_token HTTP " + tokenResponse.status
            );
        }

        const tokenData = await tokenResponse.text();

        console.log("TOKEN:", tokenData);

        // Иногда endpoint возвращает просто строку,
        // иногда JSON.
        let token = tokenData.trim();

        try {
            const json = JSON.parse(tokenData);

            if(typeof json === "string"){
                token = json;
            }

            if(json.token){
                token = json.token;
            }

        } catch(e){}

        if(!token){
            throw new Error("Token пустой");
        }

        status.textContent =
            "Token получен.\n\nЗапрашиваем радар...";

        // 2. Текущее время
        const time = new Date().toISOString();

        // 3. Запрашиваем DBZ
        const url =
            "/vector_wsgi" +
            "?time=" + encodeURIComponent(time) +
            "&title=" +
            encodeURIComponent(
                "bufr_dbz1,bufr_novosib_dbz1,bufr_vlad_dbz1"
            );

        const radarResponse = await fetch(url);

        if(!radarResponse.ok){
            throw new Error(
                "vector_wsgi HTTP " +
                radarResponse.status
            );
        }

        // 4. Получаем JSON
        const radarData = await radarResponse.json();

        // 5. Считаем точки
        const count =
            Array.isArray(radarData)
            ? radarData.length
            : 0;

        status.textContent =
            "РАДАР ПОЛУЧЕН\n\n" +
            "HTTP: " + radarResponse.status + "\n" +
            "Время: " + time + "\n" +
            "Точек: " + count + "\n\n" +
            "Первые данные:\n" +
            JSON.stringify(
                radarData.slice(0,5),
                null,
                2
            );

        console.log("RADAR DATA:", radarData);

    } catch(error){

        console.error(error);

        status.textContent =
            "ОШИБКА\n\n" +
            error.message +
            "\n\nЕсли это CORS — значит браузер " +
            "не разрешает запрос с нашего сайта к Nowcast.";

    }

}

</script>

</body>
</html>
