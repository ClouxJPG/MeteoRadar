<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nowcast Token Test</title>
<style>
body{
    background:#111;
    color:#fff;
    font-family:Arial;
    padding:20px;
}
button{
    width:100%;
    padding:15px;
    font-size:18px;
    border:0;
    border-radius:10px;
}
#out{
    margin-top:20px;
    padding:15px;
    background:#222;
    border-radius:10px;
    white-space:pre-wrap;
    word-break:break-all;
}
</style>
</head>

<body>

<h2>Nowcast API test</h2>

<button onclick="test()">Проверить /get_token</button>

<div id="out">Ожидание...</div>

<script>
async function test(){

    const out=document.getElementById("out");

    try{

        out.textContent="Запрос к Nowcast...";

        const r=await fetch(
            "http://nowcast.ru/get_token",
            {
                method:"GET"
            }
        );

        const text=await r.text();

        out.textContent=
            "HTTP: "+r.status+
            "\n\nОтвет:\n"+
            text;

    }catch(e){

        out.textContent=
            "ОШИБКА:\n\n"+
            e.name+
            "\n"+
            e.message;

    }
}
</script>

</body>
</html>
